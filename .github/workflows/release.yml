name: Release

# Releases are driven by the version number: bumping `version` in
# Cargo.toml and landing it on main auto-triggers a build and publishes
# v<version>. The `check` job makes this idempotent — it only releases
# when no release for that version exists yet, so unrelated edits to
# Cargo.toml (or re-runs) never re-release. `workflow_dispatch` allows a
# manual run for the current version if a release attempt needs to be retried.

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and whether it needs releasing
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version number is used once, ever. Publishing under an existing
          # number is skipped and the change ships with no download.
          highest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$version" != "$highest" ] && [ "$(printf '%s\n%s\n' "$version" "$highest" | sort -V | tail -1)" = "$highest" ]; then
            echo "::error::Version $version is not above the latest release ($highest). A version number is used once: pick a higher one."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$version — a release will be built."
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Extract release notes
        id: notes
        run: |
          version="${{ needs.check.outputs.version }}"
          body=$(awk -v v="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" v "\\]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            body="No release notes available for v$version."
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.check.outputs.version }}"
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --name "taskman v$version" \
            --title "taskman v$version" \
            --body "${{ steps.notes.outputs.body }}" \
            --target main \
            --draft=false \
            --prerelease=false \
            target/release/taskman

  mirror:
    needs: [release, check]
    # Mirror whatever the release job actually produced, even when the release leg
    # is skipped due to idempotency (always() ensures the mirror runs when check
    # says release=true).
    if: always() && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "v${{ needs.check.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          for f in dist/*; do
            wrangler r2 object put "taskman-releases/v${{ needs.check.outputs.version }}/$(basename "$f")" --file "$f" --remote
          done
