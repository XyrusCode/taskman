[package]
name = "taskman"
version = "0.1.0"
edition = "2021"
description = "Lightweight terminal task manager — task list + process monitor"
authors = ["Prince Shammah <me@xyruscode.com>"]
license = "MIT"
repository = "https://github.com/xyruscode/taskman"

[[bin]]
name = "taskman"
path = "src/main.rs"

[dependencies]
ratatui = "0.28.0"
crossterm = "0.27.0"
sysinfo = "0.32.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
